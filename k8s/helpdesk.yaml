apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: helpdesk-db, key: DB_NAME}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: helpdesk-db, key: DB_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: helpdesk-db, key: DB_PASSWORD}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: demo
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk
  template:
    metadata:
      labels:
        app: helpdesk
    spec:
      containers:
        - name: helpdesk
          image: ghcr.io/bendlelanour8-lab/cyber-sentinel-demo:9258d82e6718e59b9a14e25d4a1791bcee7fac76
          env:
            - name: DB_HOST
              value: db
            - name: DB_NAME
              valueFrom:
                secretKeyRef: {name: helpdesk-db, key: DB_NAME}
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: helpdesk-db, key: DB_USER}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: helpdesk-db, key: DB_PASSWORD}
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk
  namespace: demo
spec:
  type: NodePort
  selector:
    app: helpdesk
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30501
