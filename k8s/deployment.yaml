apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyber-demo
  namespace: demo
  labels:
    app: cyber-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cyber-demo
  template:
    metadata:
      labels:
        app: cyber-demo
    spec:
      containers:
        - name: cyber-demo
          image: cyber-demo:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: cyber-demo
  namespace: demo
spec:
  type: NodePort
  selector:
    app: cyber-demo
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
