name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enforce:
        description: "Bloquer sur les failles (false = mode demo)"
        type: boolean
        default: true

env:
  IMAGE: ghcr.io/bendlelanour8-lab/cyber-sentinel-demo

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event.inputs.enforce == 'false' }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep
      - run: semgrep scan --config p/python --severity ERROR --error --metrics off app/

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event.inputs.enforce == 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest detect --source /repo --redact --exit-code 1 -v

  deps:
    name: Dependances (Trivy)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event.inputs.enforce == 'false' }}
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD":/repo aquasec/trivy:latest fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo/app

  iac:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install checkov
      # Exception temporaire documentee : non bloquant jusqu'au sprint 3 (durcissement)
      - run: checkov -d terraform-vuln -d k8s --compact --soft-fail

  build:
    name: Build, scan image, push
    needs: [sast, secrets, deps, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan de l'image (Trivy)
        continue-on-error: ${{ github.event.inputs.enforce == 'false' }}
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL --ignore-unfixed --exit-code 1 ${{ env.IMAGE }}:${{ github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  deploy:
    name: Deploiement GitOps
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mise a jour du tag d'image
        run: |
          sed -i "s|image: ghcr.io/.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" k8s/helpdesk.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/helpdesk.yaml
          git commit -m "chore(deploy): image ${{ github.sha }} [skip ci]" || echo "rien a changer"
          git push
